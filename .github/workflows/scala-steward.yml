name: Scala Steward

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write
  issues: write # milestone assignment goes through the issues API

concurrency:
  group: scala-steward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scala-steward:
    name: Update Scala dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2.92.0
        with:
          timeout: 30min

      # Every PR must carry a milestone (repo linkage rule). Bot PRs join the current
      # ACTIVE milestone — the lowest-numbered open one, same definition as
      # scripts/check-linkage.sh (spec 008 clarification Q2 as amended 2026-07-19;
      # the earlier standing "maintenance" milestone is retired). Steward branches are `update/*`.
      - name: Assign active milestone to Steward PRs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          active=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100" \
            --jq 'sort_by(.number) | .[0].title // ""')
          if [ -z "$active" ]; then
            # Degrade gracefully: no open milestone must not fail the whole
            # (already successful) Steward run — surface it as a warning instead.
            echo "::warning title=Steward milestone::no open milestone — Steward PRs left unassigned"
            exit 0
          fi
          gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,headRefName,milestone \
            --jq '.[] | select(.headRefName | startswith("update/")) | select(.milestone == null) | .number' |
          while read -r pr; do
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --milestone "$active" \
              || echo "::warning title=Steward milestone::could not assign '$active' to PR #$pr"
          done
