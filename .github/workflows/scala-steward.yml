name: Scala Steward

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: write
  pull-requests: write
  issues: write # milestone assignment goes through the issues API

concurrency:
  group: scala-steward-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scala-steward:
    name: Update Scala dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Launch Scala Steward
        uses: scala-steward-org/scala-steward-action@v2
        with:
          timeout: 30min

      # Every PR must carry a milestone (repo linkage rule). Bot PRs get the standing
      # "maintenance" milestone (spec 008 clarification Q2); Steward branches are `update/*`.
      - name: Assign maintenance milestone to Steward PRs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list -R "$GITHUB_REPOSITORY" --state open --json number,headRefName,milestone \
            --jq '.[] | select(.headRefName | startswith("update/")) | select(.milestone == null) | .number' |
          while read -r pr; do
            gh pr edit "$pr" -R "$GITHUB_REPOSITORY" --milestone maintenance
          done
