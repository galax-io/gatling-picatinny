# Scala Steward update policy (spec 008, FR-020).
# Bot PRs are auto-assigned to the lowest-numbered OPEN milestone by the workflow post-step
# (.github/workflows/scala-steward.yml), satisfying the every-PR-needs-a-milestone linkage rule.

# Semantic commit convention (AGENTS.md): dependency bumps are build(deps).
commits.message = "build(deps): update ${artifactName} from ${currentVersion} to ${nextVersion}"

# Keep update PRs reviewable: at most 10 open update PRs per run.
updates.limit = 10

# Gatling is a Provided host-runtime dependency: version moves are a deliberate maintainer
# decision (compatibility-sensitive), never a bot PR. Scala 2 -> 3 is the same story: an edition
# migration needs a deliberate, planned port (macro/reflection APIs, cross-build strategy), not
# an automated PR. Drop the scala-library entry once that migration is actually undertaken.
updates.ignore = [
  { groupId = "io.gatling" },
  { groupId = "io.gatling.highcharts" },
  { groupId = "org.scala-lang", artifactId = "scala-library" }
]

# The sbt MAJOR line is a governance decision, not a bot bump (spec 012, FR-018). The build is
# cross-built on sbt 1 and sbt 2: 1.x is the declared default pin (project/build.properties) and
# 2.x is selected per-invocation with `sbt --sbt-version 2.0.6`, verified daily by
# .github/workflows/sbt2-compat.yml. Moving the default is a deliberate maintainer call, so pin
# Steward to the 1.x line — patch and minor bumps within 1.x still flow normally.
updates.pin = [ { groupId = "org.scala-sbt", artifactId = "sbt", version = "1." } ]
