apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: gatling-picatinny
  description: Gatling DSL extensions library for feeders, transactions, assertions, templates, config management, JWT generation, and Redis integration
  annotations:
    github.com/project-slug: galax-io/gatling-picatinny
    galaxio.io/plans.opennfr: "contract: renders requirements into Gatling assertions"
    galaxio.io/plans.docker-images: "runtime: CI runs the example simulations in the Gatling runtime image"
    galaxio.io/uses.spec-kit-galaxio-bootstrap: "process: created from the template, takes process updates via copier update"
spec:
  type: library
  lifecycle: production
  owner: galaxio
  dependsOn:
    - component:default/spec-kit-galaxio-bootstrap
