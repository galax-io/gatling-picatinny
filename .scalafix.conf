# Idiomatic-Scala lint gate (#273, spec 008 FR-016). Check: `sbt "scalafixAll --check"`.
# Fix: `sbt scalafixAll scalafmtAll` (fix first, then format — the two converge).
# Per-site escape hatch: `// scalafix:ok <Rule>` with a justification comment.
rules = [
  DisableSyntax
  ProcedureSyntax
  RemoveUnused
  OrganizeImports
]

DisableSyntax.noReturns = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noFinalize = true
# FR-016 mandates banning null COMPARISONS (idiom: pattern match / Option), not every null
# literal — this library legitimately passes null at JVM-interop seams (JDBC, Gatling ctors,
# classloader parents). A full noNulls would bury real findings under interop suppressions.
DisableSyntax.regex = [
  {
    id = "nullComparison"
    pattern = "[!=]=\\s*null"
    message = "Null comparisons are banned (AGENTS.md idiom rules): wrap in Option(...) and pattern match instead."
  }
]

OrganizeImports {
  # Deterministic layout with minimal churn against the existing style.
  groupedImports = Keep
  # Unused-import deletion is RemoveUnused's job; keep one rule authoritative.
  removeUnused = false
  targetDialect = Scala2
}
