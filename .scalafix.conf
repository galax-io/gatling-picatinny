# Idiomatic-Scala lint gate (#273, spec 008 FR-016). Check: `sbt "scalafixAll --check"`.
# Fix: `sbt scalafixAll scalafmtAll` (fix first, then format — the two converge).
# Per-site escape hatch: `// scalafix:ok <Rule>` with a justification comment.
rules = [
  DisableSyntax
  ProcedureSyntax
  RemoveUnused
  OrganizeImports
  NoValInForComprehension
  RedundantSyntax
  ExplicitResultTypes
]

DisableSyntax.noReturns = true
DisableSyntax.noAsInstanceOf = true
DisableSyntax.noIsInstanceOf = true
DisableSyntax.noFinalize = true
DisableSyntax.noXml = true
# FR-016 mandates banning null COMPARISONS (idiom: pattern match / Option), not every null
# literal — this library legitimately passes null at JVM-interop seams (JDBC, Gatling ctors,
# classloader parents). A full noNulls would bury real findings under interop suppressions.
DisableSyntax.regex = [
  {
    id = "nullComparison"
    pattern = "[!=]=\\s*null"
    message = "Null comparisons are banned (AGENTS.md idiom rules): wrap in Option(...) and pattern match instead."
  }
  {
    id = "threadSleep"
    pattern = "Thread\\.sleep"
    message = "Sleep-based synchronization is banned (#109): await a deterministic signal (latch) or a bounded poll probe."
  }
  {
    id = "printlnDebug"
    pattern = "\\bprintln\\("
    message = "println is banned in library code: use the scala-logging Logger (or Gatling's stats/console facilities)."
  }
]

# NOT ENABLED — LeakingImplicitClassVal: its auto-fix privatizes the public `val` of the five
# published implicit classes (FeederOps, BodyOps, FieldValOps, TransactionsOps, toRps), which
# removes a public accessor = binary break (constitution II). Rewrite rules ignore
# scalafix:ok/off suppressions (verified empirically), so there is no per-site escape.
# Revisit at the next MAJOR version when the accessors can be privatized for real.

OrganizeImports {
  # Deterministic layout with minimal churn against the existing style.
  groupedImports = Keep
  # Unused-import deletion is RemoveUnused's job; keep one rule authoritative.
  removeUnused = false
  targetDialect = Scala2
}
